name: Lyrics broker

on:
  pull_request:
    paths:
      - "services/isla-lyrics-broker/**"
      - ".github/workflows/lyrics-broker.yml"
  push:
    paths:
      - "services/isla-lyrics-broker/**"
      - ".github/workflows/lyrics-broker.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/isla-lyrics-broker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/isla-lyrics-broker/package-lock.json
      - run: npm ci
      - run: npm run verify
